---
- name: Synchronize custom_dexcontrol through the Teleop gateway
  hosts: all
  become: false
  vars_files:
    - defaults.yml
  tasks:
    - name: Stop existing Vega processes before replacing source
      ansible.builtin.import_tasks: stop.yml

    - name: Ensure the gateway staging directory exists
      ansible.builtin.file:
        path: "{{ dexcontrol_staging_dir }}"
        state: directory
        mode: "0755"

    - name: Copy source to the gateway
      ansible.posix.synchronize:
        src: "{{ dexcontrol_source_dir }}/"
        dest: "{{ dexcontrol_staging_dir }}/"
        archive: true
        owner: false
        group: false
        delete: true
        use_ssh_args: true
        private_key: "{{ ansible_ssh_private_key_file | default(omit) }}"
        rsync_opts:
          - --exclude=.git
          - --exclude=.venv/
          - --exclude=/.python/
          - --exclude=/third_party/
          - --exclude=__pycache__/
          - --exclude=*.pyc
          - --exclude=*.egg-info/
          - --exclude=.pytest_cache/
          - --exclude=.ruff_cache/
          - --exclude=build/
          - --exclude=dist/
          - --exclude=.env*
          - --exclude=/unit_config.json
          - --exclude=*.mp4

    - name: Copy source from the gateway to Vega
      ansible.builtin.command:
        argv:
          - rsync
          - -az
          - --delete
          - --rsync-path=mkdir -p {{ dexcontrol_project_dir | quote }} && rsync
          - --exclude=.git
          - --exclude=.venv/
          - --exclude=/.python/
          - --exclude=/third_party/
          - --exclude=__pycache__/
          - --exclude=*.pyc
          - --exclude=*.egg-info/
          - --exclude=.pytest_cache/
          - --exclude=.ruff_cache/
          - --exclude=build/
          - --exclude=dist/
          - --exclude=.env*
          - --exclude=/unit_config.json
          - --exclude=*.mp4
          - -e
          - sshpass -e ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10
          - "{{ dexcontrol_staging_dir }}/"
          - "{{ dexmate_user }}@{{ dexmate_ip }}:{{ dexcontrol_project_dir }}/"
      environment:
        SSHPASS: "{{ dexmate_pass }}"
      no_log: true
      changed_when: true

    - name: Read the selected source version
      ansible.builtin.command:
        argv: "{{ ['git', '-C', dexcontrol_source_dir] + item }}"
      loop:
        - [rev-parse, --abbrev-ref, HEAD]
        - [rev-parse, HEAD]
        - [describe, --tags, --exact-match]
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      register: dexcontrol_source_version
      failed_when: dexcontrol_source_version.rc != 0 and item[0] != 'describe'
      changed_when: false

    - name: Record the installed version on Vega
      ansible.builtin.command:
        argv: "{{ dexmate_ssh_argv + ['bash', '-s'] }}"
        stdin: |
          set -euo pipefail
          cat > {{ (dexcontrol_project_dir ~ '/version_info.txt') | quote }} <<'VERSION'
          branch: {{ dexcontrol_source_version.results[0].stdout }}
          commit: {{ dexcontrol_source_version.results[1].stdout }}
          tag: {{ dexcontrol_source_version.results[2].stdout | default('no tag', true) }}
          VERSION
      environment:
        SSHPASS: "{{ dexmate_pass }}"
      no_log: true
      changed_when: true
