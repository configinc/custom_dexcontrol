---
- name: Prepare the Teleop gateway and Vega host
  hosts: all
  become: false
  vars_files:
    - defaults.yml
  tasks:
    - name: Validate deployment configuration
      ansible.builtin.assert:
        that:
          - dexcontrol_project_dir.startswith('/') and dexcontrol_project_dir != '/'
          - dexcontrol_staging_dir.startswith('/') and dexcontrol_staging_dir != '/'
      tags: always

    - name: Install gateway transfer tools
      become: true
      ansible.builtin.apt:
        name: [sshpass, rsync, tmux, socat, iproute2, python3]
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: host

    - name: Install Vega host tools and pinned uv
      ansible.builtin.command:
        argv: "{{ dexmate_ssh_argv + ['bash', '-s'] }}"
        stdin: |
          set -euo pipefail
          sudo -n apt-get update
          sudo -n apt-get install -y ca-certificates git rsync tmux python3-venv build-essential cmake ninja-build libgl1 libegl1 libcap2-bin
          tools_dir={{ dexcontrol_tools_dir | quote }}
          if [ ! -x "$tools_dir/bin/python" ]; then
            python3 -m venv "$tools_dir"
          fi
          "$tools_dir/bin/python" -m pip install {{ ('uv==' ~ dexcontrol_uv_version) | quote }}
          sudo -n usermod -aG dialout {{ dexmate_user | quote }}
          printf '%s\n' 'SUBSYSTEM=="tty", ATTRS{idVendor}=="0403", MODE="0660", GROUP="dialout"' | \
            sudo -n tee /etc/udev/rules.d/99-dexcontrol-gripper.rules >/dev/null
          sudo -n udevadm control --reload-rules
          sudo -n udevadm trigger --subsystem-match=tty
      environment:
        SSHPASS: "{{ dexmate_pass }}"
      no_log: true
      changed_when: true
      tags: host
