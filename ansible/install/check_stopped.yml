---
- name: Require Vega robot services to be stopped before installation
  ansible.builtin.command:
    argv: "{{ dexmate_ssh_argv + ['bash', '-s'] }}"
    stdin: |
      set -euo pipefail
      for session in {{ dexcontrol_tmux_session | quote }} robot-server; do
        if command -v tmux >/dev/null && tmux has-session -t "=$session" 2>/dev/null; then
          echo "Stop $session before deploying; installation temporarily adjusts the clock." >&2
          exit 1
        fi
      done
  environment:
    SSHPASS: "{{ dexmate_pass }}"
  register: dexcontrol_stopped_check
  failed_when: false
  no_log: true
  changed_when: false

- name: Report why Vega cannot be installed
  ansible.builtin.fail:
    msg: "{{ dexcontrol_stopped_check.stderr | default('Could not verify that Vega robot services are stopped.', true) }}"
  when: dexcontrol_stopped_check.rc | default(1) != 0
