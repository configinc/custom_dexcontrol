[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dexcontrol"
version = "0.5.0rc1"
description = "A Python library of Sensing and Control for Dexmate's Robot"
authors = [{ name = "Dexmate", email = "contact@dexmate.ai" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Robot Framework :: Library",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
keywords = ["robot", "python", "control", "learning"]
license = { file = "LICENSE" }
readme = "README.md"
dependencies = [
    "numpy>=1.26.4",
    "loguru>=0.7.0",
    "jaxtyping>=0.3.0",
    "rich",
    "dexcomm>=0.6.0rc2,<0.7.0",
    "dexbot-utils>=0.5.0",
    "grpcio>=1.81.1",
    "protobuf>=6.33.5",
    "scipy",
    "pytransform3d",
    "dexmotion",
    "proxsuite"
]
requires-python = ">=3.10,<=3.13.11"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff",
    "isort>=5.12.0",
    "pyright",
    "pre-commit",
]
docs = [
    "sphinx>=7.0.0",
    "furo>=2023.09.10",
    "sphinx-autodoc-typehints>=1.24.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
    "markitdown[all]>=0.1.0",
]
example = [
    "dualsense-controller",
    "matplotlib>=3.8.0",
    "tyro",
]
loop = [
    "loop-sdk>=0.4.2.dev0",
    "loop-node>=0.1.0,<0.2.0",
]
robotiq = ["robotiq-2f-85-controller==0.1.0"]
sr-gripper = ["sr-gripper-controller"]

[project.scripts]
dexcontrol-loop-robot-node = "loop_bridge.__main__:main"

[project.urls]
Repository = "https://github.com/dexmate-ai/dexcontrol"


[tool.isort]
profile = "black"
multi_line_output = 3

[tool.ruff.format]
exclude = ["*_pb2.py", "*_pb2.pyi", "src/dexcontrol/sensors/**"]
quote-style = "double"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Ignore the warning from jaxtyping
select = ["E", "F", "I001"]
ignore = ["F722", "E501"]

# Ignore the unused import warning for __init__.py
[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.uv.sources]
loop-sdk = { path = "third_party/loop-sdk", editable = true }
loop-node = { path = "third_party/loop/packages/loop-node", editable = true }
robotiq-2f-85-controller = { path = "robotiq_2f_85_controller", editable = true }
sr-gripper-controller = { path = "sr_gripper_controller", editable = true }

[tool.uv]
# ruckig 0.17.3 still uses the cmake.targets setting removed in 0.10.
build-constraint-dependencies = ["scikit-build-core==0.9.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/dexcontrol", "src/loop_bridge"]

[tool.pyright]
include = ["src/dexcontrol/core/", "src/dexcontrol/config/", "src/loop_bridge/", "examples/"]
typeCheckingMode = "standard"
