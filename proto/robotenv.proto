// robotenv.proto - RobotEnv gRPC Service Specification
//
// This service provides a robot-agnostic interface for robot control.
// Implement this service to make your robot compatible with the control loop.
//
// Key concepts:
// - Observations: Robot state (joints, gripper, etc.) returned by the robot
// - Actions: Commands sent to the robot (cartesian velocity, joint position, etc.)
// - Action spaces: Different representations of commands (cartesian vs joint)
// - Dual-arm: Run two service instances for dual-arm robots

syntax = "proto3";

package robotenv;

// RobotEnv service manages robot hardware and provides control interface.
service RobotEnv {
    // GetObservationSpec returns the schema of observations this robot provides.
    // Call this once at startup to understand what fields are available.
    //
    // Example: If robot provides joint_positions and cartesian_position,
    // control loop knows it can use both for policy input.
    rpc GetObservationSpec(GetObservationSpecRequest) returns (ObservationSpec);

    // GetConfig returns robot hardware configuration.
    // Includes gripper type, frame type, degrees of freedom, etc.
    rpc GetConfig(GetConfigRequest) returns (RobotConfig);

    // Reset robot to initial state.
    // Supports different reset modes: home, random, target position, or current.
    //
    // Returns initial observation after reset completes.
    rpc Reset(ResetRequest) returns (ResetResponse);

    // Step executes one action and returns the resulting observation.
    // This is a blocking call - returns when action is executed and fresh observation is ready.
    //
    // Action is provided in the specified action_space (e.g., cartesian_velocity, joint_position).
    // Returns robot state observation after executing the action.
    rpc Step(StepRequest) returns (StepResponse);

    // HealthCheck verifies service is running and ready.
    // Used for service discovery and readiness probes.
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

    // GetVersion returns the deployed code version info.
    // Reads from version_info.txt generated during Ansible deployment.
    rpc GetVersion(GetVersionRequest) returns (VersionInfo);

    // External-wrench calibration is prepared by Start, then released one
    // stage at a time by Advance so a coordinator can keep both arms aligned.
    // Start, Advance, Commit, and Cancel acknowledge quickly; motion/fitting
    // continue in the background and are observed through GetStatus. Status and
    // Cancel must remain serviceable during motion. While a run is non-terminal,
    // Step and motion-producing Reset modes are FAILED_PRECONDITION; the
    // no-motion Reset(mode="current") remains available. After the final stage,
    // each server fits, returns to its start pose, durably stages the candidate,
    // and reports READY_TO_APPLY. RCI commits only after both arms are ready.
    // A server must stop active motion before serving after process restart.
    // Start atomically acquires command ownership only while the robot is
    // quiescent; an in-flight Step or Reset makes Start FAILED_PRECONDITION.
    // A staged READY_TO_APPLY candidate survives restart so Commit can be
    // retried. Calibrated inference is enabled only after both arms report
    // SUCCEEDED and the empty GetResult lookup on both arms returns a committed
    // current result with the same run_id, source_run_id, and plan_sha256.
    // A cache pair with different source_run_id values is discarded and both
    // arms start a new force_recalibrate=true run. Before sending the
    // first Commit, RCI durably records the bilateral COMMIT decision. After
    // that point it never Cancels either participant and retries Commit until
    // both succeed; this closes coordinator-crash and one-sided-delivery races.
    rpc StartForceCalibration(StartForceCalibrationRequest) returns (ForceCalibrationStatus);
    rpc AdvanceForceCalibration(AdvanceForceCalibrationRequest) returns (ForceCalibrationStatus);
    rpc CommitForceCalibration(CommitForceCalibrationRequest) returns (ForceCalibrationStatus);
    rpc GetForceCalibrationStatus(GetForceCalibrationStatusRequest) returns (ForceCalibrationStatus);
    rpc CancelForceCalibration(CancelForceCalibrationRequest) returns (ForceCalibrationStatus);
    rpc GetForceCalibrationResult(GetForceCalibrationResultRequest) returns (ForceCalibrationResult);
}

// ============================================================================
// Request/Response Messages
// ============================================================================

message GetObservationSpecRequest {
    // Empty request - spec doesn't change
}

message GetConfigRequest {
    // Empty request - config doesn't change
}

message HealthCheckRequest {
    // Empty request
}

message GetVersionRequest {
    // Empty request
}

message StartForceCalibrationRequest {
    // Shared by the left and right servers in one coordinated run.
    // run_id must be non-empty. Repeating Start with the same run_id and the
    // same force_recalibrate value is idempotent. While a physical run is
    // active, retries must keep the same fit inputs. Empty run_id is
    // INVALID_ARGUMENT. Conflicting retry arguments,
    // or a different run_id while calibration owns the robot, must be rejected
    // as FAILED_PRECONDITION. A successful reply is READY_FOR_STAGE or a
    // terminal state; Start never moves the robot. With force_recalibrate=false,
    // a valid applied cache returns SUCCEEDED under the requested run_id.
    string run_id = 1;
    bool force_recalibrate = 2;
    // Existing GUI inputs forwarded by the bilateral coordinator to each
    // owning robot server. COM is expressed in that server's sensor frame.
    double gripper_mass_kg = 3;
    repeated double gripper_com_sensor_m = 4;
    // Existing frame.yaml target selected by RCI for this arm. The owning
    // server uses it only for the successful post-fit return.
    repeated double normal_reset_joint_positions_rad = 5;
}

message AdvanceForceCalibrationRequest {
    string run_id = 1;
    // Zero-based index of the exact next stage advertised by Status. stage_id
    // must equal that Status stage_id. A retry for the current/completed stage is
    // idempotent and must not repeat motion or collection. A stale run_id, a
    // skipped index, or a mismatched stage_id is FAILED_PRECONDITION.
    uint32 stage_index = 2;
    string stage_id = 3;
}

message CommitForceCalibrationRequest {
    // Commit is accepted only in READY_TO_APPLY. The candidate has already
    // passed quality checks, been durably staged, and requires no robot motion.
    // Matching retries are idempotent; a stale run or plan is FAILED_PRECONDITION.
    string run_id = 1;
    string plan_sha256 = 2;
}

message GetForceCalibrationStatusRequest {
    // Empty means the server's current/most recent run. A non-empty unknown or
    // stale run_id is NOT_FOUND; it must never alias a newer run. Before any
    // run, an empty request returns IDLE with empty run_id.
    string run_id = 1;
}

message CancelForceCalibrationRequest {
    // Cancellation is idempotent for this run_id. Empty/unknown/stale run_id
    // is NOT_FOUND. After CANCELLING no new pose may start; terminal states do
    // not transition back to a non-terminal state.
    string run_id = 1;
    // Emergency reset owns robot recovery and must suppress the calibration
    // worker's competing safe return.  False preserves legacy client behavior.
    bool skip_safe_return = 2;
}

message GetForceCalibrationResultRequest {
    // Empty returns the currently applied calibration, or available=false when
    // none is active. A non-empty run_id
    // returns only that immutable run result; unknown/stale is NOT_FOUND and
    // must never alias the currently applied result. A known non-succeeded run
    // returns available=false, its run_id, and a message.
    string run_id = 1;
}

enum ForceCalibrationState {
    FORCE_CALIBRATION_STATE_UNSPECIFIED = 0;
    FORCE_CALIBRATION_STATE_IDLE = 1;
    FORCE_CALIBRATION_STATE_READY_FOR_STAGE = 2;
    FORCE_CALIBRATION_STATE_MOVING = 3;
    FORCE_CALIBRATION_STATE_SETTLING = 4;
    FORCE_CALIBRATION_STATE_COLLECTING = 5;
    FORCE_CALIBRATION_STATE_FITTING = 6;
    FORCE_CALIBRATION_STATE_APPLYING = 7;
    FORCE_CALIBRATION_STATE_RETURNING = 8;
    FORCE_CALIBRATION_STATE_SUCCEEDED = 9;
    FORCE_CALIBRATION_STATE_FAILED = 10;
    FORCE_CALIBRATION_STATE_CANCELLING = 11;
    FORCE_CALIBRATION_STATE_CANCELLED = 12;
    FORCE_CALIBRATION_STATE_READY_TO_APPLY = 13;
}

message ForceCalibrationStatus {
    ForceCalibrationState state = 1;
    string run_id = 2;
    // Zero-based stage awaiting release or currently executing. After all stages
    // complete it equals total_stages. completed_stages is the count fully
    // collected, so the coordinator releases n only after both arms report
    // READY_FOR_STAGE with current_stage_index=n and matching plan/stage identity.
    uint32 current_stage_index = 3;
    uint32 completed_stages = 4;
    uint32 total_stages = 5;
    string message = 6;
    // arm_name identifies left/right. plan_id names the complete bilateral
    // plan artifact. plan_sha256 is the lowercase hexadecimal SHA-256 of that
    // artifact's exact UTF-8 bytes; both arm servers receive the byte-identical
    // artifact. stage_id is the shared semantic stage name from that artifact,
    // while each arm may have different joint targets. Both servers must report
    // equal plan_id, plan_sha256, total_stages, current_stage_index, and stage_id
    // before either arm is released.
    string arm_name = 7;
    string plan_id = 8;
    string plan_sha256 = 9;
    string stage_id = 10;
    // Random identifier regenerated on each server process start. A change
    // during motion/collection means the coordinator must fail the pair; a
    // recovered READY_TO_APPLY candidate may still be committed.
    string server_instance_id = 11;
    // True only when Start reused a valid applied cache. If only one arm reuses
    // cache, the coordinator starts a new force_recalibrate=true run on both.
    bool cache_reused = 12;
    // Unix-epoch microseconds. If the next coordinator command does not arrive
    // by this server-owned deadline, the server automatically cancels safely.
    // It is zero in READY_TO_APPLY and terminal states: a durable candidate
    // never auto-cancels and waits for an explicit Commit or Cancel.
    int64 command_deadline_timestamp_us = 13;
}

message ForceCalibrationResult {
    // When available=false, only run_id and message may be non-default.
    bool available = 1;
    int64 calibrated_at_timestamp_us = 2;
    int64 expires_at_timestamp_us = 3;
    string calibration_kind = 4;
    // Strict UTF-8 JSON objects: finite numbers only, no NaN or Infinity. They
    // are inspectable/recordable evidence;
    // only the owning robot server may restore its private cache from them.
    string parameters_json = 5;
    string quality_json = 6;
    string message = 7;
    string run_id = 8;
    uint32 schema_version = 9;
    string reference_point_id = 10;
    string arm_name = 11;
    string plan_id = 12;
    string plan_sha256 = 13;
    string server_instance_id = 14;
    // Coordinated bilateral run that produced the numerical fit; differs from
    // run_id only when a later Start reused the cached result. Both arms must
    // expose the same source_run_id before calibrated inference is enabled.
    string source_run_id = 15;
    // Immutable historical fact. Current application is established only by
    // empty GetResult, whose returned run_id identifies the active calibration.
    bool was_committed = 16;
}

// ============================================================================
// ObservationSpec - describes observation schema
// ============================================================================

message ObservationSpec {
    // Map of field name to field specification
    // Example: {"joint_positions": FieldSpec{dtype: "float64", shape: [7], ...}}
    map<string, FieldSpec> fields = 1;

    // Number of arms this robot has (1 for single-arm, 2 for dual-arm)
    int32 num_arms = 2;

    // Metadata about robot capabilities
    map<string, string> metadata = 3;
}

message FieldSpec {
    // Data type: "float32", "float64", "int64", "uint8", etc.
    string dtype = 1;

    // Shape of the data (e.g., [7] for joint_positions, [6] for cartesian)
    // Empty array means scalar value
    repeated int32 shape = 2;

    // Whether this field is always present (true) or optional (false)
    bool required = 3;

    // Human-readable description of this field
    string description = 4;
}

// ============================================================================
// Reset - initialize robot state
// ============================================================================

message ResetRequest {
    // Reset mode: "home", "random", "target", "current"
    //
    // - "home": Move to default home position (params ignored)
    // - "random": Randomize within safe joint limits (params ignored)
    // - "target": Move to specific target (params must include target state)
    // - "current": No movement, just return current state (params ignored)
    string mode = 1;

    // Mode-specific parameters
    // For "target" mode: {"joint_positions": [7 floats]} or {"cartesian_position": [6 floats]}
    map<string, Value> params = 2;
}

message ResetResponse {
    // Initial observation after reset
    map<string, Value> observation = 1;

    // Status code: "SUCCESS" or error code (e.g., "JOINT_LIMIT_EXCEEDED")
    string status = 2;

    // Human-readable status message
    string message = 3;

    // Observation timestamp in microseconds since epoch
    int64 timestamp_us = 4;
}

// ============================================================================
// Step - execute action
// ============================================================================

message StepRequest {
    // Action vector
    // - For cartesian spaces: [vx, vy, vz, roll_vel, pitch_vel, yaw_vel, gripper] (7D)
    // - For joint spaces: [j1, j2, j3, j4, j5, j6, j7, gripper] (8D)
    repeated double action = 1;

    // Action space type:
    // - "cartesian_velocity": Cartesian velocity control (7D)
    // - "cartesian_delta": Cartesian position delta (7D)
    // - "joint_position": Joint position control (8D)
    // - "joint_velocity": Joint velocity control (8D)
    // - "joint_delta": Joint position delta (8D)
    string action_space = 2;

    // Gripper action space: "position" (absolute) or "velocity" (delta)
    // If not specified, inferred from action_space (velocity actions → velocity, otherwise position)
    string gripper_action_space = 3;
}

message StepResponse {
    // Robot state observation after executing action
    map<string, Value> observation = 1;

    // Status code:
    // - "SUCCESS": Action executed successfully
    // - "ESTOP_TRIGGERED": Emergency stop was triggered
    // - "JOINT_LIMIT_EXCEEDED": Joint limit violation
    // - "COMMUNICATION_FAILED": Lost connection to robot hardware
    // - "COLLISION_DETECTED": Collision detected
    string status = 2;

    // Detailed error message (empty if status is SUCCESS)
    string message = 3;

    // Observation timestamp in microseconds since epoch
    int64 timestamp_us = 4;

    // Action info: comprehensive action representation computed by the server.
    // Contains all derived action data (joint_position, joint_velocity,
    // cartesian_position, cartesian_velocity, delta_action, gripper_delta, etc.)
    // so that downstream data pipelines receive the same rich format
    // regardless of robot type (Franka, Vega, etc.).
    map<string, Value> action_info = 5;
}

// ============================================================================
// Robot Configuration
// ============================================================================

message RobotConfig {
    // Gripper type: "franka_hand", "robotiq", "robotiq_2f85", etc.
    string gripper_type = 1;

    // Frame type: "plane_frame_v1", "y_frame_v1", etc.
    // Indicates robot mounting orientation
    string frame_type = 2;

    // Degrees of freedom (e.g., [7] for Franka)
    repeated int32 dof = 3;

    // Supported action spaces
    // Example: ["cartesian_velocity", "cartesian_delta", "joint_position"]
    repeated string supported_action_spaces = 4;

    // Additional robot-specific metadata
    map<string, string> metadata = 5;
}

// ============================================================================
// Health Check
// ============================================================================

message HealthCheckResponse {
    // Service status: "HEALTHY", "DEGRADED", "UNHEALTHY"
    string status = 1;

    // Optional details about service health
    string message = 2;

    // Service version (optional)
    string version = 3;
}

// ============================================================================
// Version Info - deployed code version
// ============================================================================

message VersionInfo {
    // Git branch at deployment time
    string branch = 1;

    // Git commit hash at deployment time
    string commit = 2;

    // Git tag at deployment time (e.g., "v2.4.14" or "no tag")
    string tag = 3;

    // Robot firmware version (e.g., "0.5.0"). Empty string if unavailable.
    string firmware_version = 4;
}

// ============================================================================
// Value - flexible value type for observations and parameters
// ============================================================================

message Value {
    oneof kind {
        double float_value = 1;
        FloatArray float_array = 2;
        int64 int_value = 3;
        string string_value = 4;
        bytes bytes_value = 5;  // For images or binary data
    }
}

message FloatArray {
    repeated double values = 1;
}
